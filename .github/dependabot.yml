version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3

  # Maintain GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 3
